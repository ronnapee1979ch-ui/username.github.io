<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>PANEL BUY</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0a2cff,#6a00ff);
    color:#fff;
}
.panel{
    width:330px;
    background:#0b1022;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px rgba(120,0,255,0.6);
}
h1{
    text-align:center;
    margin-bottom:15px;
    color:#7fd6ff;
}
input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    outline:none;
    margin-bottom:10px;
}
button.login{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#1e90ff,#9b4dff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
.menu{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
}
.toggle{
    width:42px;
    height:22px;
    background:#333;
    border-radius:22px;
    position:relative;
    cursor:pointer;
}
.toggle::after{
    content:"";
    width:20px;
    height:20px;
    background:#ff4d4d;
    border-radius:50%;
    position:absolute;
    top:1px;
    left:1px;
    transition:.3s;
}
.toggle.active{
    background:#2ecc71;
}
.toggle.active::after{
    left:21px;
    background:#00ffd5;
}
.footer{
    text-align:center;
    margin-top:12px;
    font-size:12px;
    color:#aaa;
}
.hidden{ display:none; }
</style>
</head>
<body>

<div class="panel">
    <h1>PANEL BUY</h1>

    <!-- LOGIN -->
    <div id="loginBox">
        <input id="user" placeholder="user">
        <input id="pass" type="password" placeholder="pass">
        <button class="login" onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- PANEL -->
    <div id="panelBox" class="hidden">
        <div class="menu"><span>AIMBOT 80%</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>AIMLOCK 50%</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>INJECT DATA</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>AIMSHOP</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>120 FPS</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>ANTI BAN</span><div class="toggle" onclick="toggle(this)"></div></div>
        <div class="menu"><span>ANTI VIRUS</span><div class="toggle" onclick="toggle(this)"></div></div>

        <div class="footer">Status : READY</div>
    </div>
</div>

<script>
function login(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if(u === "free557" && p === "free557"){
        alert("เข้าสู่ระบบสำเร็จ ✅");
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("panelBox").classList.remove("hidden");
    }else{
        alert("user หรือ pass ไม่ถูกต้อง ❌");
    }
}

function toggle(el){
    el.classList.toggle("active");
    if(el.classList.contains("active")){
        alert("เปิดใช้งานแล้ว ✅");
    }else{
        alert("ปิดใช้งานแล้ว ❌");
    }
}
</script>

</body>
  </html>
